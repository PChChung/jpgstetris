<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#3a3366" />
<title>小遊戲庫</title>
<link rel="stylesheet" href="shared/base.css?v=202610300024" />
<style>
.page { max-width: 760px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 32px) 16px 48px; }
.hero { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 12px 20px; margin-bottom: 28px; }
.hero h1 { margin: 0; font-size: clamp(34px, 9vw, 48px); font-weight: 900; letter-spacing: 3px; line-height: 1; }
.hero p { margin: 10px 0 0; font-size: 14px; font-weight: 400; color: var(--ink-soft); }
.player { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-soft); }
.player b { color: var(--ink); }

/* 架子：卡帶排在一條深色層板上 */
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 22px 18px; padding: 0 4px 22px; border-bottom: 10px solid var(--shell-lo); }

/* 卡帶：淺灰塑膠殼、右上角斜切、上緣防滑紋、貼一張標籤 */
.cart {
  --cut: 26px;
  position: relative;
  display: flex;
  flex-direction: column;
  padding: 26px 14px 14px;
  background: #d9d6e6;
  color: var(--key-ink);
  clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, 0 100%);
  border-radius: 10px 0 12px 12px;
  box-shadow: inset 0 -6px 0 #b4b0c8;
}
.cart::before {
  content: "";
  position: absolute;
  top: 8px; left: 18px; right: calc(var(--cut) + 18px);
  height: 10px;
  background: repeating-linear-gradient(90deg, #b4b0c8 0 3px, transparent 3px 8px);
}
.label {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 12px;
  align-items: center;
  padding: 14px;
  border-radius: 6px;
  background: var(--lcd);
  color: var(--lcd-ink);
  box-shadow: inset 0 0 0 3px var(--label-accent);
}
.art { display: grid; gap: 2px; }
.artRow { display: flex; gap: 2px; }
.artCell { width: 9px; height: 9px; border-radius: 2px; }
.cartTitle { font-size: 22px; font-weight: 900; line-height: 1.2; }
.cartTags { font-size: 12px; font-weight: 400; color: var(--lcd-dim); margin-top: 4px; }
.cartDesc { font-size: 14px; font-weight: 400; line-height: 1.7; margin: 12px 2px 0; }
.cartFoot { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; margin-top: 14px; padding-bottom: 6px; }
.cartFoot .btn { display: grid; place-items: center; text-decoration: none; min-height: 46px; }
.cartFoot .rank { background: var(--shell); color: var(--ink); box-shadow: 0 4px 0 var(--shell-lo); padding: 0 14px; }
.cartFoot .rank:active { box-shadow: 0 1px 0 var(--shell-lo); }
.best { font-size: 12px; font-weight: 400; color: #5d5a78; margin: 10px 2px 0; }
.best b { font-family: var(--pixel); font-weight: 700; color: var(--key-ink); }

.slot { display: grid; place-items: center; min-height: 220px; border-radius: 12px; border: 3px dashed var(--shell-hi); color: var(--ink-soft); font-size: 14px; text-align: center; padding: 20px; }
</style>
</head>
<body>
<main class="page">
  <header class="hero">
    <div>
      <h1>小遊戲庫</h1>
      <p>打開就能玩，手機、平板、電腦都適用</p>
    </div>
    <div class="player">玩家 <b id="playerName">未設定</b><button class="btn ghost small" id="renameBtn" type="button">改名稱</button></div>
  </header>
  <section class="shelf" id="shelf" aria-label="遊戲列表"></section>
</main>
<script type="module">
import { GAMES } from './shared/games.js?v=202610300024';
import { getBestScore, getPlayerName } from './shared/player.js?v=202610300024';
import { askName, openLeaderboard } from './shared/ui.js?v=202610300024';
import { createProgress } from './shared/handheld.js?v=202610300024';

const COLORS = { I: '#4dd8ff', J: '#5b7cff', L: '#ff9a3c', O: '#ffd23f', S: '#5ee0a0', T: '#b57bff', Z: '#ff5c8a' };
const shelf = document.getElementById('shelf');
const nameEl = document.getElementById('playerName');

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function drawArt(rows) {
  const art = el('div', 'art');
  art.setAttribute('aria-hidden', 'true');
  rows.forEach((row) => {
    const line = el('div', 'artRow');
    [...row].forEach((c) => {
      const cell = el('span', 'artCell');
      if (COLORS[c]) cell.style.background = COLORS[c];
      line.append(cell);
    });
    art.append(line);
  });
  return art;
}

function showName() {
  nameEl.textContent = getPlayerName() || '未設定';
}

for (const game of GAMES) {
  const cart = el('article', 'cart');

  const label = el('div', 'label');
  label.style.setProperty('--label-accent', game.accent);
  const titleWrap = el('div');
  titleWrap.append(el('div', 'cartTitle', game.title), el('div', 'cartTags', game.tags.join('、')));
  label.append(drawArt(game.art ?? []), titleWrap);

  const best = el('p', 'best');
  if (game.leaderboard) {
    best.append('本機最高分 ', el('b', '', String(getBestScore(game.id))), '　');
  }
  if (game.levels) {
    const store = createProgress(game.id);
    best.append('關卡 ', el('b', '', `★ ${store.total(store.load())} / ${game.levels * 3}`));
  }

  const foot = el('div', 'cartFoot');
  const play = el('a', 'btn primary', '開始玩');
  play.href = game.path;
  foot.append(play);
  if (game.leaderboard) {
    const rank = el('button', 'btn rank', '排行榜');
    rank.type = 'button';
    rank.onclick = () => openLeaderboard({ gameId: game.id, title: `${game.title}排行榜` });
    foot.append(rank);
  } else {
    foot.style.gridTemplateColumns = '1fr';
  }

  cart.append(label, el('p', 'cartDesc', game.description), best, foot);
  shelf.append(cart);
}
shelf.append(el('div', 'slot', '下一款遊戲製作中'));

document.getElementById('renameBtn').onclick = async () => {
  await askName({ title: '修改玩家名稱', note: '排行榜與對戰都會使用這個名稱。' });
  showName();
};
showName();
</script>
</body>
</html>
