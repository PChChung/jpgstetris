<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#071120" />
<title>小遊戲庫</title>
<link rel="stylesheet" href="shared/base.css" />
<style>
.page { max-width: 760px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 28px) 16px 40px; }
.hero { text-align: center; margin-bottom: 26px; }
.hero h1 { margin: 0; font-size: clamp(30px, 8vw, 44px); font-weight: 1000; letter-spacing: 3px; text-shadow: 0 0 18px rgba(80, 150, 255, .8); }
.hero p { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
.player { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 14px; color: var(--accent); }
.player button { background: none; border: 1px solid rgba(155, 185, 225, .5); color: var(--text); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 14px; }
.card { position: relative; display: flex; flex-direction: column; gap: 10px; border: 2px solid var(--border); border-radius: 16px; padding: 16px; background: linear-gradient(180deg, rgba(11, 27, 49, .95), rgba(6, 16, 30, .98)); box-shadow: 0 0 16px rgba(0, 127, 255, .18); color: inherit; text-decoration: none; }
.card::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; border-radius: 14px 14px 0 0; background: var(--card-accent); }
.cardTop { display: flex; align-items: center; gap: 12px; }
.cardIcon { width: 48px; height: 48px; display: grid; place-items: center; font-size: 28px; border-radius: 12px; background: rgba(255, 255, 255, .06); }
.cardTitle { font-size: 21px; font-weight: 1000; }
.cardBest { font-size: 12px; color: var(--muted); margin-top: 2px; }
.cardBest b { color: var(--gold); }
.cardDesc { font-size: 14px; line-height: 1.6; color: #d8e2f0; margin: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid rgba(155, 185, 225, .4); color: var(--accent); }
.cardActions { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: auto; }
.cardActions .btn { min-height: 44px; display: grid; place-items: center; text-decoration: none; }
.soon { opacity: .55; border-style: dashed; justify-content: center; align-items: center; text-align: center; min-height: 180px; color: var(--muted); font-weight: 800; }
</style>
</head>
<body>
<main class="page">
  <header class="hero">
    <h1>小遊戲庫</h1>
    <p>打開就能玩，手機、平板、電腦都適用</p>
    <div class="player">玩家：<span id="playerName">未設定</span><button id="renameBtn" type="button">修改</button></div>
  </header>
  <section class="grid" id="gameGrid"></section>
</main>
<script type="module">
import { GAMES } from './shared/games.js';
import { getBestScore, getPlayerName } from './shared/player.js';
import { askName, openLeaderboard } from './shared/ui.js';

const grid = document.getElementById('gameGrid');
const nameEl = document.getElementById('playerName');

function showName() {
  nameEl.textContent = getPlayerName() || '未設定';
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

for (const game of GAMES) {
  const card = el('article', 'card');
  card.style.setProperty('--card-accent', game.accent);

  const top = el('div', 'cardTop');
  const titleWrap = el('div');
  const best = el('div', 'cardBest', '本機最高分 ');
  best.append(el('b', '', String(getBestScore(game.id))));
  titleWrap.append(el('div', 'cardTitle', game.title), best);
  top.append(el('div', 'cardIcon', game.icon), titleWrap);

  const tags = el('div', 'tags');
  game.tags.forEach((t) => tags.append(el('span', 'tag', t)));

  const actions = el('div', 'cardActions');
  const play = el('a', 'btn blue', '開始玩');
  play.href = game.path;
  const rank = el('button', 'btn', '🏆');
  rank.type = 'button';
  rank.title = '排行榜';
  rank.onclick = () => openLeaderboard({ gameId: game.id, title: `${game.title}排行榜` });
  actions.append(play, rank);

  card.append(top, el('p', 'cardDesc', game.description), tags, actions);
  grid.append(card);
}
grid.append(el('div', 'card soon', '更多遊戲製作中…'));

document.getElementById('renameBtn').onclick = async () => {
  await askName({ title: '修改玩家名稱', note: '排行榜與對戰都會使用這個名稱。' });
  showName();
};
showName();
</script>
</body>
</html>
