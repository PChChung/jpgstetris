<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="俄羅斯方塊" />
<meta name="theme-color" content="#3a3366" />
<title>俄羅斯方塊</title>
<link rel="stylesheet" href="../../shared/base.css?v=202610300040" />
<link rel="stylesheet" href="../../shared/handheld.css?v=202610300040" />
<link rel="stylesheet" href="style.css?v=202610300040" />
</head>
<body>
<div class="modal" id="menu">
  <div class="box">
    <h1 class="boxTitle">俄羅斯方塊</h1>
    <div class="menuGrid">
      <button class="btn primary" id="singleBtn">單人模式</button>
      <button class="btn hot" id="challengeBtn">關卡挑戰</button>
      <button class="btn" id="battleBtn">玩家對戰</button>
      <button class="btn" id="menuRankBtn">排行榜</button>
      <a class="btn ghost" href="../../">返回遊戲庫</a>
    </div>
    <p class="small">鍵盤：← → 移動，↑ 或空白鍵旋轉，↓ 下移，Enter 落下，P 暫停</p>
  </div>
</div>

<div class="modal hide" id="levels">
  <div class="box">
    <div class="boxHead">
      <h1 class="boxTitle">關卡挑戰</h1>
      <div class="starTotal" id="starTotal">★ 0 / 60</div>
    </div>
    <div class="levelGrid" id="levelGrid"></div>
    <p class="small">過關解鎖下一關，用越少方塊或越短時間過關，星星越多。</p>
    <button class="btn ghost wideBtn" id="levelsBack">返回主選單</button>
  </div>
</div>

<div class="modal hide" id="lobby">
  <div class="box">
    <h1 class="boxTitle">玩家對戰</h1>
    <div id="lobbyJoin">
      <label class="fieldLabel" for="playerNameInput">你的名稱</label>
      <input id="playerNameInput" class="input" maxlength="16" placeholder="玩家" />
      <button id="createRoom" class="btn primary wideBtn">建立房間</button>
      <div class="divider">或輸入朋友的房號</div>
      <input id="joinCode" class="input codeInput" maxlength="6" placeholder="ABC123" autocomplete="off" aria-label="房號" />
      <button id="joinRoom" class="btn wideBtn">加入房間</button>
    </div>
    <div id="lobbyWaiting" class="hide">
      <div class="roomCodeWrap">
        <div class="roomCode" id="roomCodeView">------</div>
        <button id="copyRoom" class="btn small">複製房號</button>
      </div>
      <div class="playerList" id="playerList"></div>
      <button id="startBattle" class="btn primary wideBtn" disabled>開始遊戲</button>
    </div>
    <button id="backMenu" class="btn ghost wideBtn">返回主選單</button>
    <div class="status" id="lobbyStatus"></div>
  </div>
</div>

<div class="app" id="app">
  <header class="topbar">
    <button class="iconBtn" id="backBtn" title="返回" aria-label="返回">‹</button>
    <div class="modeTag" id="modeTag">單人模式</div>
    <button class="iconBtn" id="restartBtn" title="重新開始" aria-label="重新開始">↻</button>
    <button class="iconBtn" id="rankBtn" title="排行榜" aria-label="排行榜">♛</button>
    <button class="iconBtn" id="pauseBtn" title="暫停" aria-label="暫停">Ⅱ</button>
  </header>

  <section class="screen">
    <div class="stage" id="touchArea">
      <canvas id="board"></canvas>
      <div class="garbageMeter" id="garbageMeter"></div>
      <div id="overlay" class="overlay">
        <div class="overlayInner">
          <div id="resultTitle" class="resultTitle">GAME OVER</div>
          <div class="resultStars hide" id="resultStars"></div>
          <div class="overScore" id="finalScoreLine">分數 <span id="finalScore">0</span></div>
          <div class="overExtra" id="extraScore"></div>
          <div class="hint" id="overlayHint"></div>
          <button id="overlayAction" class="btn primary hide">再玩一次</button>
          <button id="overlaySecondary" class="btn ghost small hide"></button>
        </div>
      </div>
    </div>
    <aside class="side">
      <div class="readout">
        <div class="readLabel">下一個</div>
        <canvas id="next" class="nextCanvas" width="100" height="66"></canvas>
      </div>
      <div class="readout">
        <div class="readLabel">分數</div>
        <div id="score" class="readValue gold">0</div>
        <div class="readLabel">行數</div>
        <div id="lines" class="readValue">0</div>
        <div class="readLabel">速度</div>
        <div id="level" class="readValue">1</div>
      </div>
      <div class="readout grow hide" id="goalCard">
        <div class="readLabel">目標</div>
        <div class="goalText" id="goalText"></div>
        <div class="goalProgress" id="goalProgress"></div>
        <div class="goalSub" id="goalSub"></div>
      </div>
      <div class="readout grow hide" id="oppCard">
        <div class="readLabel" id="oppName">對手</div>
        <canvas id="oppBoard" class="oppCanvas" width="80" height="160"></canvas>
        <div id="oppStats" class="goalSub"></div>
      </div>
      <div class="readout grow" id="bestCard">
        <div class="readLabel">最高分</div>
        <div id="bestScore" class="readValue gold">0</div>
        <div class="goalSub">結束後自動上傳排行榜</div>
      </div>
    </aside>
  </section>

  <section class="pad" aria-label="操作按鈕">
    <div class="dpad">
      <button class="dkey left" id="leftBtn" aria-label="左移">◀</button>
      <span class="dhub" aria-hidden="true"></span>
      <button class="dkey right" id="rightBtn" aria-label="右移">▶</button>
      <button class="dkey down" id="downBtn" aria-label="下移">▼</button>
    </div>
    <div class="abKeys">
      <button class="roundKey yellow low" id="rotateBtn"><span>旋轉</span></button>
      <button class="roundKey pink" id="dropBtn"><span>落下</span></button>
    </div>
  </section>
</div>
<script type="module" src="main.js?v=202610300040"></script>
</body>
</html>
