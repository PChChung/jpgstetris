<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="光點迷宮" />
<meta name="theme-color" content="#3a3366" />
<title>光點迷宮</title>
<link rel="stylesheet" href="../../shared/base.css?v=202610300028" />
<link rel="stylesheet" href="../../shared/handheld.css?v=202610300028" />
<style>
.screen { grid-template-rows: auto minmax(0, 1fr); }
.lives { color: var(--pink); letter-spacing: 2px; }
.freeze { color: #4dd8ff; }
.pad { justify-content: center; }
/* 迷宮只靠十字鍵操作，鍵做大一點；整塊十字鍵都是感應區 */
.pad .dpad.cross { --k: clamp(52px, min(19vw, 9vh), 76px); touch-action: none; }
.dpad.cross .dkey { pointer-events: none; }
/* 按住拖曳時，在手指按下的位置顯示搖桿中心 */
.stick { position: absolute; width: 72px; height: 72px; margin: -36px 0 0 -36px; border-radius: 50%; border: 2px solid rgba(217, 242, 228, .35); pointer-events: none; display: none; }
.stick::after { content: ""; position: absolute; inset: 28px; border-radius: 50%; background: rgba(217, 242, 228, .45); }
.stick.show { display: block; }
</style>
</head>
<body>
<div class="modal" id="levels">
  <div class="box">
    <div class="boxHead">
      <h1 class="boxTitle">光點迷宮</h1>
      <div class="starTotal" id="starTotal">★ 0 / 60</div>
    </div>
    <div class="levelGrid" id="levelGrid"></div>
    <p class="small">手指按住畫面往想走的方向拖，按住不放就會一直走；也可以用十字鍵或鍵盤方向鍵。撿到藍色電池會凍住巡邏機，這時撞上去能把它們送回基地。P 暫停。</p>
    <a class="btn ghost wideBtn block" href="../../">返回遊戲庫</a>
  </div>
</div>

<div class="app" id="app">
  <header class="topbar">
    <button class="iconBtn" id="backBtn" title="選關" aria-label="選關">‹</button>
    <div class="modeTag" id="modeTag">光點迷宮</div>
    <button class="iconBtn" id="restartBtn" title="重新開始" aria-label="重新開始">↻</button>
    <button class="iconBtn" id="pauseBtn" title="暫停" aria-label="暫停">Ⅱ</button>
    <span></span>
  </header>

  <section class="screen">
    <div class="hud">
      <span>生命 <span class="lives" id="lives">♥♥♥</span></span>
      <span class="freeze" id="freeze"></span>
      <span>光點<b id="dotsLeft">0</b></span>
    </div>
    <div class="stage" id="stage">
      <canvas id="canvas"></canvas>
      <div class="stick" id="stick"></div>
      <div class="overlay" id="overlay"></div>
    </div>
  </section>

  <section class="pad" aria-label="操作按鈕">
    <div class="dpad cross" id="dpad">
      <button class="dkey up" id="upBtn" aria-label="上">▲</button>
      <button class="dkey left" id="leftBtn" aria-label="左">◀</button>
      <span class="dhub" aria-hidden="true"></span>
      <button class="dkey right" id="rightBtn" aria-label="右">▶</button>
      <button class="dkey down" id="downBtn" aria-label="下">▼</button>
    </div>
  </section>
</div>
<script type="module" src="main.js?v=202610300028"></script>
</body>
</html>
